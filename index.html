<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>择时镜子 TimingMirror · 本地确定性分析（Tushare 动态日线）</title>
<link rel="stylesheet" href="/src/ui/styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <strong>择时镜子 TimingMirror</strong>
    <span class="sub">个人交易行为分析智能体 · Tushare 动态日线（服务端获取，非实时）</span>
  </div>
  <div class="topbar-actions">
    <nav class="view-switch" aria-label="界面视图">
      <span class="view-option is-active" aria-current="page">开发者</span>
      <a class="view-option" href="prototype/user-frontend/index.html" title="打开用户端原型">用户端</a>
    </nav>
    <div class="chips" id="capability-chips"></div>
    <button id="assistant-toggle" class="btn assistant-toggle-btn" type="button" aria-controls="assistant" aria-expanded="false">AI 助手</button>
  </div>
</header>
<div class="app-body" id="app-body">
  <div class="app-main" id="app-main">
    <nav class="tabs" id="nav"></nav>
    <main id="view" class="view"></main>
    <footer class="footer">
      <div id="footer-labels" class="stack"></div>
    </footer>
  </div>
  <aside id="assistant" class="assistant-panel" aria-label="AI 助手"></aside>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
